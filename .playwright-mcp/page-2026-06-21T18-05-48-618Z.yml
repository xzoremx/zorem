                    - text: "Hello friends, enjoy it. :8:"
                    - list [ref=e151]:
                      - listitem [ref=e152]: Removed all korean comments
                      - listitem [ref=e153]: Common bugs fixed
                      - listitem [ref=e154]: Source migrated to use x64 instead of x86
                      - listitem [ref=e155]: All warnings solved (source using /w3)
                      - listitem [ref=e156]: Using safer functions for memory operations
                      - listitem [ref=e157]: Using Precompiled Header
                      - listitem [ref=e158]: Game and Server in different source files (same project)
                      - listitem [ref=e159]: Removed unused code and files
                      - listitem [ref=e160]: Source files organized in folders
                      - listitem [ref=e161]: Graphics Rendering rewrote and refactored to use Directx 11
                      - listitem [ref=e162]: Network rewrote to use SLikeNet library (UDP + Messages Stream etc)
                      - listitem [ref=e163]: Removed transformed vertices from rendering
                      - listitem [ref=e164]: Some rendering stuffs using DirectxTK (fonts etc)
                      - listitem [ref=e165]: All textures converted to DDS
                      - listitem [ref=e166]: Source using vcpkg to manage dependencies (lua, slikenet, rmlui, dxtk)
                      - listitem [ref=e167]: Source integrated with RmlUI (html rendering library)
                      - listitem [ref=e168]: Source integrated with Github actions to validate commits automatically
                      - listitem [ref=e169]: Input subsytem using DXTK
                      - listitem [ref=e170]: Network messages handler (handle and process your network messages dynamically)
                      - listitem [ref=e171]: Cursor rendering using Windows API
                      - listitem [ref=e172]: Network remote procedure call system (call a function with custom arguments over network)
                      - listitem [ref=e173]: "Network properties replication draft (you can check it in `feature/property-replication` branch)"
