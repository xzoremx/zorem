                    - generic [ref=e189]: Handle a Network Message
                    - text: The first thing you need to do to handle a Network Message, it is define an unique OpCode as identifier for this Network Message. This OpCode will be used to identify the Network Message through Network Socket and know which data struct should be used, which functions will handle it etc.
                    - text: You must define your OpCode in the NetworkDef.h file, inside of enum class OpCode.
                    - generic [ref=e190]:
                      - generic [ref=e191]: "Code:"
                      - code [ref=e194]: "enum class OpCode { MyCustomNetworkMessage };"
                    - generic [ref=e195]: Network Message Data
                    - text: To define a Network Message Data, you must create a file hpp inside the directory shared/Network/Messages specific for that Message.
                    - generic [ref=e196]:
                      - generic [ref=e197]: "Code:"
                      - code [ref=e200]: "#pragma once #include \"Network/NetworkDef.h\" #include \"Network/NetworkMessage.h\" namespace Network { class MyData : public Message { public: bool Loaded = false; int Other = 0; void Serialize(MessageStream& Message) override { Message.Write(Loaded); Message.Write(Other); } void Deserialize(MessageStream& Message) override { Message.Read(Loaded); Message.Read(Other); } bool Validate() override { // Ensure message can be handled. If this function wasn't implemented, the network message will always be handled if (Loaded) return true; return false; } }; DECLARE_NETWORK_MESSAGE(MyData, OpCode::MyCustomNetworkMessage)"
                    - generic [ref=e201]: Handle Network Message
                    - generic [ref=e202]:
                      - generic [ref=e203]: "Code:"
                      - code [ref=e206]: "namespace Network { class Foo { public: void Handle(Connection* Connection, MyData& Data) { } void HandleWithoutData(Connection* Connection) { // Since we don't have a Message Data for that OpCode, we just need the Connection pointer to Handle it } }; ServerMessagesHandler::ServerMessagesHandler() { Foo foo; HANDLE_NETWORK_MESSAGE(OpCode::MyCustomNetworkMessage, ValidationType::Authed, ProcessingType::InPlace, &Foo::Handle, foo); HANDLE_NETWORK_MESSAGE(OpCode::MyCustomNetworkMessageWithoutData, ValidationType::Authed, ProcessingType::InPlace, &Foo::HandleWithoutData, foo); } }"
